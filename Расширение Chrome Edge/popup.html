<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Режим концентрации</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; font: 14px Segoe UI, Arial, sans-serif; color: #18202b; background: #fff; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .state { font-weight: 600; }
    textarea { width: 100%; height: 130px; box-sizing: border-box; resize: vertical; padding: 8px; border: 1px solid #c9d0da; border-radius: 8px; font: 12px Consolas, monospace; }
    button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 8px; background: #4f7fff; color: white; cursor: pointer; font-weight: 600; }
    button.secondary { background: #e9edf4; color: #18202b; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 24px; background: #b9c2cf; cursor: pointer; transition: .2s; }
    .slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: white; transition: .2s; }
    input:checked + .slider { background: #35a56b; }
    input:checked + .slider:before { transform: translateX(20px); }
    #message { height: 18px; margin-top: 8px; color: #27754b; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Режим концентрации</h1>
  <div class="row">
    <span class="state" id="state">Загрузка…</span>
    <label class="switch"><input id="enabled" type="checkbox"><span class="slider"></span></label>
  </div>
  <label for="hosts">Заблокированные сайты:</label>
  <textarea id="hosts" spellcheck="false"></textarea>
  <button id="save">Сохранить сайты</button>
  <button id="openOptions" class="secondary">Открыть настройки расширения</button>
  <div id="message"></div>
  <script src="popup.js"></script>
</body>
</html>
