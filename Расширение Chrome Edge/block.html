<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ ограничен</title>
  <link rel="stylesheet" href="vendor/materialize.min.css">
  <style>
    :root { color-scheme: dark; }
    html, body { overflow: hidden; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display:none; width:0; height:0; }
    html.timepicker-lock, html.timepicker-lock body { overflow:hidden !important; height:100% !important; }
    html:has(.timepicker-modal.open), body:has(.timepicker-modal.open) { overflow:clip !important; overscroll-behavior:none !important; }
    body:has(.timepicker-modal.open) { position:fixed !important; top:0 !important; left:0 !important; right:0 !important; width:100% !important; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; background: linear-gradient(#090909b8, #090909d9), url('loading-bg.png') center / cover fixed; color: #f0f0f0; }
    main, .calendar-panel { box-sizing: border-box; border: 1px solid #4a4a4a; border-radius: 8px; background: linear-gradient(145deg, #202020, #151515); box-shadow: 0 20px 60px #000b; }
    main { position: relative; width: 360px; height: 522px; flex: 0 0 360px; padding: 28px 24px; text-align: center; }
    .calendar-panel { position: relative; width: min(820px, calc(100vw - 420px)); height: 522px; }
    .icon-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 18px; }
    .icon { display: block; width: 220px; height: 220px; background: url('block-art.png') center / contain no-repeat; image-rendering: pixelated; border: 0; border-radius: 0; transition: filter .25s ease; }
    .icon:hover { filter: blur(4px); }
    .timer-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .timer-ring-track, .timer-ring-progress { fill: none; stroke-width: 12; }
    .timer-ring-track { stroke: #111; opacity: .8; }
    .timer-ring-progress { stroke: #45c985; stroke-linecap: round; opacity:0; transition:stroke-dashoffset .8s linear, opacity .2s; }
    .icon-wrap.focus-active .timer-ring-progress { opacity:1; }
    .icon-wrap #countdown { position:absolute; z-index:2; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:0; margin:0; padding:12px; box-sizing:border-box; color:#fff; font-family:Consolas,"Courier New",monospace; text-align:center; text-shadow:0 2px 8px #000; opacity:0; transition:opacity .2s; pointer-events:none; }
    .timer-total { visibility:hidden; color:#ddd; font-size:18px; }
    .timer-label { color:#45c985; font-size:17px; text-transform:uppercase; letter-spacing:1px; }
    .timer-remaining { font-size:26px; font-weight:700; }
    .icon-wrap:hover #countdown { opacity:1; }
    .icon-wrap.timer-locked .icon { filter:blur(4px); }
    .icon-wrap.timer-locked #countdown { opacity:1; }
    .timer-lock { position:absolute; z-index:3; left:50%; bottom:34px; display:grid; place-items:center; width:30px; height:30px; padding:0; border:0; color:#bbb; background:transparent; opacity:0; transform:translateX(-50%); cursor:pointer; transition:opacity .2s, color .2s; }
    .icon-wrap:hover .timer-lock, .icon-wrap.timer-locked .timer-lock { opacity:1; }
    .timer-lock:hover { color:#45c985; }
    .timer-lock svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .settings-button { position: absolute; top: 12px; right: 14px; display: grid; place-items: center; width: 28px; height: 28px; border: 0; color: #aaa; background: transparent; text-decoration: none; transition: color .2s, transform .2s; }
    .settings-button:hover { color: #45c985; transform: rotate(-12deg); }
    .settings-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .focus-toggle { position:absolute; z-index:4; top:62px; left:50%; display:block; width:50px; height:27px; padding:0; border:1px solid #666; border-radius:999px; background:#383838; opacity:0; transform:translateX(-50%); pointer-events:none; transition:opacity .2s; cursor:pointer; }
    .icon-wrap:hover .focus-toggle { opacity:1; pointer-events:auto; }
    .focus-toggle.is-on { border-color:#45c985; background:#45c985; }
    .focus-toggle-knob { position:absolute; display:block; width:20px; height:20px; left:3px; top:2px; border-radius:50%; background:#e8e8e8; box-shadow:0 1px 4px #0008; transition:transform .2s; }
    .focus-toggle.is-on .focus-toggle-knob { transform:translateX(22px); }
    .focus-toggle:focus, .focus-toggle:focus-visible { outline:none; box-shadow:0 0 0 2px #45c98566; }
    .focus-timer { position:absolute; z-index:4; top:96px; left:50%; width:58px; opacity:0; transform:translateX(-50%); pointer-events:none; transition:opacity .2s; }
    .icon-wrap:hover .focus-timer { opacity:1; pointer-events:auto; }
    .focus-toggle.is-on + .focus-timer { opacity:0; pointer-events:none; }
    .icon-wrap.timer-locked .focus-toggle { opacity:1; pointer-events:none; }
    .icon-wrap.timer-locked .focus-timer { opacity:0; pointer-events:none; }
    .focus-timer-input { width:50px !important; height:24px !important; min-height:24px !important; margin:0 !important; padding:0 !important; border:0 !important; border-bottom:1px solid #777 !important; border-radius:0 !important; color:#ddd !important; background:transparent !important; font:600 11px Consolas,monospace !important; line-height:20px !important; text-align:center; box-shadow:none !important; }
    .focus-timer-input:focus { border-bottom-color:#45c985 !important; box-shadow:none !important; }
    .timepicker-modal { position:fixed !important; inset:0 !important; top:0 !important; left:0 !important; width:100vw !important; height:100vh !important; max-width:none !important; max-height:none !important; margin:0 !important; transform:none !important; border:0; border-radius:0; overflow:visible !important; background:transparent !important; box-shadow:none !important; }
    .timepicker-modal .timepicker-container.modal-content { position:absolute; top:6%; left:30%; width:min(360px, calc(100vw - 32px)); height:auto; max-height:none; margin:0; display:flex; flex-direction:column !important; align-items:center; justify-content:center; padding:0 !important; transform:translateX(-50%) scale(.9); border:1px solid #555; border-radius:10px; overflow:visible !important; background:#202020; }
    .timepicker-modal .timepicker-digital-display, .timepicker-modal .timepicker-analog-display, .timepicker-modal .timepicker-footer { flex:none; width:100%; }
    .timepicker-modal .timepicker-digital-display { background:#292929 !important; }
    .timepicker-modal .timepicker-analog-display { background:#202020 !important; }
    .timepicker-modal .timepicker-footer { background:#202020 !important; }
    .timepicker-modal .timepicker-digital-display { padding:5px !important; }
    .timepicker-modal .timepicker-text-container { font-size:3rem; }
    .timepicker-modal .timepicker-plate { width:270px; height:270px; margin-top:10px; margin-bottom:0; transform:scale(.85); transform-origin:center center; }
    .modal-overlay { background:#000b !important; }
    h1 { margin: 0 0 14px; font: 700 36px Consolas, "Courier New", monospace; }
    p { color: #aaa; font-size: 18px; line-height: 1.5; }
    #countdown { min-height: 28px; margin: 18px 0 0; color: #f0f0f0; font: 600 20px Consolas,"Courier New",monospace; }
    .music-controls { display: flex; justify-content: center; gap: 10px; margin-top: 4px; }
    .music-card { position:absolute; left:24px; right:24px; bottom:24px; display:flex; align-items:center; gap:10px; margin:0; padding:6px; border:1px solid #454545; border-radius:9px; background:#171717aa; text-align:left; }
    .track-cover-button { position:relative; display:none; flex:0 0 68px; width:68px; height:68px; margin-left:4px; padding:0; border:0; border-radius:6px; overflow:hidden; color:#fff; background:#292929; cursor:pointer; }
    .track-cover { display:block; width:100%; height:100%; object-fit:cover; transition:filter .2s ease; }
    .track-cover-button::after { content:""; position:absolute; inset:0; background:#0005; opacity:0; transition:opacity .2s; }
    .track-cover-button:hover::after, .track-cover-button:focus-visible::after { opacity:1; }
    .track-cover-button:focus, .track-cover-button:focus-visible { outline:none; box-shadow:none; }
    .track-cover-eye { position:absolute; z-index:1; left:50%; top:50%; width:25px; height:25px; transform:translate(-50%, -50%); opacity:0; transition:opacity .2s; }
    .track-cover-button:hover .track-cover { filter:blur(4px); }
    .track-cover-button:hover .track-cover-eye, .track-cover-button:focus-visible .track-cover-eye { opacity:1; }
    .music-info { min-width:0; flex:1; text-align:center; }
    .track-title { max-width:none; min-height:22px; margin:0; overflow:hidden; color:#aaa; font:600 17px Consolas,"Courier New",monospace; text-overflow:ellipsis; white-space:nowrap; }
    .track-artist { max-width:none; margin-top:3px; overflow:hidden; color:#777; font:500 13px Consolas,"Courier New",monospace; text-overflow:ellipsis; white-space:nowrap; }
    .music-button { width: 52px; height: 36px; padding: 0; border: 0; border-radius: 0; color: #bbb; background: transparent !important; font-size: 29px; line-height: 1; cursor: pointer; transition: color .2s, transform .2s; }
    .music-button:hover { color: #45c985; transform: translateY(-1px); }
    .music-button:focus, .music-button:focus-visible { outline: none; box-shadow: none; }
    .music-button svg { display: block; width: 32px; height: 32px; margin: auto; fill: currentColor; }
    .music-button .previous-icon { transform: rotate(180deg); }
    .music-button .pause-icon { fill: currentColor; stroke: none; }
    .calendar-panel { position:relative; overflow:hidden; }
    .calendar-frame { display:block; width:100%; height:520px; border:0; background:#151515; filter:invert(.92) hue-rotate(180deg); }
    .calendar-frame.is-light { filter:none; }
    .calendar-theme-button { position: fixed; z-index: 5; top: 16px; right: 20px; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; color: #ddd; background: transparent; cursor: pointer; }
    .calendar-theme-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .calendar-theme-button svg.moon-icon { fill: currentColor; stroke: none; }
    .calendar-theme-button:hover { color: #45c985; transform: scale(1.08); }
    @media (max-width: 980px) { body { flex-direction: column; } main, .calendar-panel { width: min(860px, calc(100vw - 48px)); } main { height: auto; flex-basis: auto; } .calendar-panel { height: auto; } .music-card { position:static; margin:12px auto 0; } }
    @media (max-width: 640px) { main { padding: 28px 20px; } .icon { width: 170px; height: 170px; } h1 { font-size: 28px; } .calendar-days { gap:6px; } .day-header { padding:8px; font-size:12px; } .day-events { padding:5px; } }
  </style>
</head>
<body>
  <main>
    <a class="settings-button" href="options.html" target="_top" aria-label="Открыть расширенные настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></svg>
    </a>
    <div class="icon-wrap">
      <button id="focus-toggle" class="focus-toggle" type="button" role="switch" aria-checked="false" aria-label="Включить режим концентрации"><span class="focus-toggle-knob"></span></button>
      <div class="focus-timer"><input id="focus-timepicker" class="timepicker focus-timer-input" type="text" value="-:-" placeholder="-:-" aria-label="Таймер режима концентрации"></div>
      <div class="icon" role="img" aria-label="Иллюстрация режима концентрации"></div>
      <svg class="timer-ring" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="timer-ring-track" cx="110" cy="110" r="95"></circle>
        <circle id="timer-ring-progress" class="timer-ring-progress" cx="110" cy="110" r="95"></circle>
      </svg>
      <div id="countdown"><span class="timer-total"></span><span class="timer-label">Осталось</span><span class="timer-remaining"></span></div>
      <button id="timer-lock" class="timer-lock" type="button" aria-label="Закрепить таймер"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
    <h1>Доступ ограничен</h1>
    <div class="music-card">
      <button id="music-open" class="track-cover-button" type="button" aria-label="Открыть Яндекс Музыку"><img id="track-cover" class="track-cover" alt=""><svg class="track-cover-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <div class="music-info">
        <div id="track-title" class="track-title"></div>
        <div id="track-artist" class="track-artist"></div>
        <div class="music-controls" aria-label="Управление Яндекс Музыкой">
          <button class="music-button" type="button" data-music-action="previous" aria-label="Предыдущий трек"><svg class="previous-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 10 7-10 7V5ZM19 5v14h-2V5h2Z"/></svg></button>
          <button class="music-button" type="button" data-music-action="pause" aria-label="Пауза или воспроизведение"><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
          <button class="music-button" type="button" data-music-action="next" aria-label="Следующий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 10 7-10 7V5ZM19 5v14h-2V5h2Z"/></svg></button>
        </div>
      </div>
    </div>
  </main>
  <section class="calendar-panel" aria-label="Мой календарь">
    <button id="calendar-theme" class="calendar-theme-button" type="button" aria-label="Переключить тему календаря">☀</button>
    <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?src=tru60117%40gmail.com&amp;color=%234285f4&amp;src=o9h6dglqoqrdrocjvh81m53490%40group.calendar.google.com&amp;color=%23d50000&amp;ctz=Europe%2FMoscow&amp;mode=WEEK&amp;bgcolor=%23151515&amp;hl=ru&amp;showCalendars=1&amp;showTabs=0&amp;showTz=0" title="Мои календари" loading="lazy"></iframe>
  </section>
  <script src="vendor/materialize.min.js"></script>
  <script src="block.js"></script>
</body>
</html>
