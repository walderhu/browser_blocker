<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ ограничен</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Segoe UI, Arial, sans-serif; background: radial-gradient(circle at 50% 0%, #303030 0, transparent 36%), #090909; color: #f0f0f0; }
    main { max-width: 560px; margin: 24px; padding: 42px; text-align: center; border: 1px solid #4a4a4a; border-radius: 8px; background: linear-gradient(145deg, #202020, #151515); box-shadow: 0 20px 60px #000b; }
    .icon { width: 112px; height: 112px; margin: 0 auto 18px; object-fit: cover; image-rendering: pixelated; border: 2px solid #696969; border-radius: 8px; background: #111; }
    h1 { margin: 0 0 14px; font: 700 36px Consolas, "Courier New", monospace; }
    p { color: #aaa; font-size: 18px; line-height: 1.5; }
    button { margin-top: 16px; padding: 12px 22px; border: 1px solid #777; border-radius: 5px; background: #d6d6d6; color: #111; font-size: 16px; cursor: pointer; }
    button:hover { background: #fff; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" alt="">
    <h1>Доступ ограничен</h1>
    <p>Этот сайт заблокирован режимом концентрации.</p>
    <button onclick="history.back()">Вернуться назад</button>
  </main>
</body>
</html>
