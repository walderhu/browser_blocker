<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ ограничен</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Segoe UI, Arial, sans-serif; background: #10131a; color: #f4f6fb; }
    main { max-width: 560px; margin: 24px; padding: 42px; text-align: center; border: 1px solid #303846; border-radius: 22px; background: #191e29; box-shadow: 0 20px 60px #0007; }

    h1 { margin: 0 0 14px; font-size: 36px; }
    p { color: #b9c1d0; font-size: 18px; line-height: 1.5; }
    button { margin-top: 16px; padding: 12px 22px; border: 0; border-radius: 10px; background: #5b8cff; color: white; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="icon">⛔</div>
    <h1>Фиг тебе 🙂</h1>
    <p>Этот сайт сейчас заблокирован родительским ограничителем.</p>
    <button onclick="history.back()">Вернуться назад</button>
  </main>

</html>
