<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ ограничен</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 0; box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; background: linear-gradient(#090909b8, #090909d9), url('loading-bg.png') center / cover fixed; color: #f0f0f0; }
    main, .calendar-panel { width: min(860px, calc(100vw - 48px)); box-sizing: border-box; border: 1px solid #4a4a4a; border-radius: 8px; background: linear-gradient(145deg, #202020, #151515); box-shadow: 0 20px 60px #000b; }
    main { padding: 42px; text-align: center; }
    .icon { width: 220px; height: 220px; margin: 0 auto 18px; object-fit: contain; image-rendering: pixelated; border: 0; border-radius: 0; background: transparent; }
    h1 { margin: 0 0 14px; font: 700 36px Consolas, "Courier New", monospace; }
    p { color: #aaa; font-size: 18px; line-height: 1.5; }
    #countdown { min-height: 28px; margin: 18px 0 0; color: #f0f0f0; font: 600 20px Consolas,"Courier New",monospace; }
    .calendar-panel { overflow: hidden; }
    .calendar-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #444; color: #aaa; font: 600 14px Consolas,"Courier New",monospace; }
    .calendar-heading a { color: #45c985; text-decoration: none; }
    .calendar-heading a:hover { text-decoration: underline; }
    .calendar-frame { display: block; width: 100%; height: 420px; border: 0; background: #fff; }
    @media (max-width: 640px) { main { padding: 28px 20px; } .icon { width: 170px; height: 170px; } h1 { font-size: 28px; } .calendar-frame { height: 360px; } }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="block-art.png" alt="">
    <h1>Доступ ограничен</h1>
    <p>Этот сайт заблокирован режимом концентрации.</p>
    <div id="countdown">Защита включена</div>
  </main>
  <section class="calendar-panel" aria-label="Мой календарь">
    <div class="calendar-heading">
      <span>Мой календарь</span>
      <a href="https://calendar.google.com/calendar/u/0/r/week" target="_blank" rel="noopener noreferrer">Открыть отдельно</a>
    </div>
    <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?src=tru60117%40gmail.com&src=o9h6dglqoqrdrocjvh81m53490%40group.calendar.google.com&ctz=Europe%2FMoscow" title="Мои календари" loading="lazy"></iframe>
  </section>
  <script src="block.js"></script>
</body>
</html>
