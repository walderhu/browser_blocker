<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ ограничен</title>
  <style>
    :root { color-scheme: dark; }
    html, body { overflow: hidden; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; background: linear-gradient(#090909b8, #090909d9), url('loading-bg.png') center / cover fixed; color: #f0f0f0; }
    main, .calendar-panel { box-sizing: border-box; border: 1px solid #4a4a4a; border-radius: 8px; background: linear-gradient(145deg, #202020, #151515); box-shadow: 0 20px 60px #000b; }
    main { position: relative; width: 360px; height: 522px; flex: 0 0 360px; padding: 28px 24px; text-align: center; }
    .calendar-panel { position: relative; width: min(820px, calc(100vw - 420px)); height: 522px; }
    .icon-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 18px; }
    .icon { display: block; width: 220px; height: 220px; background: url('block-art.png') center / contain no-repeat; image-rendering: pixelated; border: 0; border-radius: 0; transition: filter .25s ease; }
    .icon:hover { filter: blur(4px); }
    .timer-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .timer-ring-track, .timer-ring-progress { fill: none; stroke-width: 12; }
    .timer-ring-track { stroke: #111; opacity: .8; }
    .timer-ring-progress { stroke: #45c985; stroke-linecap: round; transition: stroke-dashoffset .8s linear; }
    .icon-wrap #countdown { position:absolute; z-index:2; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:0; margin:0; padding:12px; box-sizing:border-box; color:#fff; font-family:Consolas,"Courier New",monospace; text-align:center; text-shadow:0 2px 8px #000; opacity:0; transition:opacity .2s; pointer-events:none; }
    .timer-total { color:#ddd; font-size:18px; }
    .timer-label { color:#45c985; font-size:17px; text-transform:uppercase; letter-spacing:1px; }
    .timer-remaining { font-size:26px; font-weight:700; }
    .icon-wrap:hover #countdown { opacity:1; }
    .icon-wrap.timer-locked .icon { filter:blur(4px); }
    .icon-wrap.timer-locked #countdown { opacity:1; }
    .timer-lock { position:absolute; z-index:3; left:50%; bottom:8px; display:grid; place-items:center; width:30px; height:30px; padding:0; border:0; color:#bbb; background:transparent; opacity:0; transform:translateX(-50%); cursor:pointer; transition:opacity .2s, color .2s; }
    .icon-wrap:hover .timer-lock, .icon-wrap.timer-locked .timer-lock { opacity:1; }
    .timer-lock:hover { color:#45c985; }
    .timer-lock svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .settings-button { position: absolute; top: 12px; right: 14px; display: grid; place-items: center; width: 28px; height: 28px; border: 0; color: #aaa; background: transparent; text-decoration: none; transition: color .2s, transform .2s; }
    .settings-button:hover { color: #45c985; transform: rotate(-12deg); }
    .settings-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0 0 14px; font: 700 36px Consolas, "Courier New", monospace; }
    p { color: #aaa; font-size: 18px; line-height: 1.5; }
    #countdown { min-height: 28px; margin: 18px 0 0; color: #f0f0f0; font: 600 20px Consolas,"Courier New",monospace; }
    .music-controls { display: flex; justify-content: center; gap: 10px; margin-top: 4px; }
    .music-card { position:absolute; left:24px; right:24px; bottom:24px; display:flex; align-items:center; gap:10px; margin:0; padding:6px; border:1px solid #454545; border-radius:9px; background:#171717aa; text-align:left; }
    .track-cover { display:none; flex:0 0 68px; width:68px; height:68px; margin-left:4px; object-fit:cover; border-radius:6px; background:#292929; transition:filter .25s ease; }
    .track-cover:hover { filter:blur(4px); }
    .music-info { min-width:0; flex:1; text-align:center; }
    .track-title { max-width:none; min-height:22px; margin:0; overflow:hidden; color:#aaa; font:600 17px Consolas,"Courier New",monospace; text-overflow:ellipsis; white-space:nowrap; }
    .track-artist { max-width:none; margin-top:3px; overflow:hidden; color:#777; font:500 13px Consolas,"Courier New",monospace; text-overflow:ellipsis; white-space:nowrap; }
    .music-button { width: 52px; height: 36px; padding: 0; border: 0; border-radius: 0; color: #bbb; background: transparent !important; font-size: 29px; line-height: 1; cursor: pointer; transition: color .2s, transform .2s; }
    .music-button:hover { color: #45c985; transform: translateY(-1px); }
    .music-button svg { display: block; width: 32px; height: 32px; margin: auto; fill: currentColor; }
    .music-button .pause-icon { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
    .calendar-panel { --cal-bg:#151515; --cal-panel:#202020; --cal-line:#444; --cal-text:#eee; --cal-muted:#999; position:relative; overflow:hidden; padding:16px; background:var(--cal-bg); }
    .calendar-panel.is-light { --cal-bg:#f2f2f2; --cal-panel:#fff; --cal-line:#d2d2d2; --cal-text:#222; --cal-muted:#777; }
    .calendar-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #444; color: #aaa; font: 600 14px Consolas,"Courier New",monospace; }
    .calendar-heading a { color: #45c985; text-decoration: none; }
    .calendar-heading a:hover { text-decoration: underline; }
    .custom-calendar { height:490px; color:var(--cal-text); }
    .custom-calendar-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .custom-calendar-title { font:600 16px Consolas,"Courier New",monospace; }
    .add-event-button { padding:7px 11px; border:1px solid #45c985; border-radius:6px; color:#45c985; background:transparent; font:600 13px "Segoe UI",Arial,sans-serif; cursor:pointer; }
    .add-event-button:hover { color:#111; background:#45c985; }
    .calendar-days { display:grid; grid-template-columns:1fr 1fr; gap:10px; height:calc(100% - 42px); }
    .calendar-day { min-width:0; overflow:hidden; border:1px solid var(--cal-line); border-radius:8px; background:var(--cal-panel); }
    .day-header { padding:10px 12px; border-bottom:1px solid var(--cal-line); font:600 14px Consolas,"Courier New",monospace; }
    .day-header small { display:block; margin-top:3px; color:var(--cal-muted); font:12px "Segoe UI",Arial,sans-serif; }
    .day-events { height:calc(100% - 56px); overflow:auto; padding:8px; }
    .empty-day { padding:20px 8px; color:var(--cal-muted); text-align:center; font-size:13px; }
    .calendar-event { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:7px; padding:8px 9px; border-left:3px solid #45c985; border-radius:5px; background:#45c9851c; }
    .calendar-event strong { display:block; font-size:13px; }
    .calendar-event time { display:block; margin-bottom:3px; color:var(--cal-muted); font:12px Consolas,"Courier New",monospace; }
    .delete-event { border:0; padding:0; color:var(--cal-muted); background:transparent; font-size:16px; cursor:pointer; }
    .delete-event:hover { color:#e66; }
    .event-dialog { width:min(360px,calc(100vw - 32px)); padding:20px; border:1px solid #555; border-radius:9px; color:#eee; background:#202020; box-shadow:0 20px 60px #000b; }
    .event-dialog::backdrop { background:#0009; }
    .event-dialog h3 { margin:0 0 14px; font:600 18px Consolas,"Courier New",monospace; }
    .event-dialog label { display:block; margin:10px 0 5px; color:#aaa; font-size:13px; }
    .event-dialog input { width:100%; padding:9px; border:1px solid #555; border-radius:5px; outline:0; color:#eee; background:#111; }
    .event-dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    .calendar-theme-button { position: fixed; z-index: 5; top: 16px; right: 20px; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; color: #ddd; background: transparent; cursor: pointer; }
    .calendar-theme-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .calendar-theme-button svg.moon-icon { fill: currentColor; stroke: none; }
    .calendar-theme-button:hover { color: #45c985; transform: scale(1.08); }
    @media (max-width: 980px) { body { flex-direction: column; } main, .calendar-panel { width: min(860px, calc(100vw - 48px)); } main { height: auto; flex-basis: auto; } .calendar-panel { height: auto; } .music-card { position:static; margin:12px auto 0; } }
    @media (max-width: 640px) { main { padding: 28px 20px; } .icon { width: 170px; height: 170px; } h1 { font-size: 28px; } .calendar-days { gap:6px; } .day-header { padding:8px; font-size:12px; } .day-events { padding:5px; } }
  </style>
</head>
<body>
  <main>
    <a class="settings-button" href="options.html" target="_top" aria-label="Открыть расширенные настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></svg>
    </a>
    <div class="icon-wrap">
      <div class="icon" role="img" aria-label="Иллюстрация режима концентрации"></div>
      <svg class="timer-ring" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="timer-ring-track" cx="110" cy="110" r="95"></circle>
        <circle id="timer-ring-progress" class="timer-ring-progress" cx="110" cy="110" r="95"></circle>
      </svg>
      <div id="countdown"><span class="timer-total"></span><span class="timer-label">Осталось</span><span class="timer-remaining"></span></div>
      <button id="timer-lock" class="timer-lock" type="button" aria-label="Закрепить таймер"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
    <h1>Доступ ограничен</h1>
    <div class="music-card">
      <img id="track-cover" class="track-cover" alt="Обложка текущего трека">
      <div class="music-info">
        <div id="track-title" class="track-title"></div>
        <div id="track-artist" class="track-artist"></div>
        <div class="music-controls" aria-label="Управление Яндекс Музыкой">
          <button class="music-button" type="button" data-music-action="previous" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5 7 12l11 7V5Z"/></svg></button>
          <button class="music-button" type="button" data-music-action="pause" aria-label="Пауза или воспроизведение"><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
          <button class="music-button" type="button" data-music-action="next" aria-label="Следующий трек"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 11 7-11 7V5Z"/></svg></button>
        </div>
      </div>
    </div>
  </main>
  <section class="calendar-panel" aria-label="Мой календарь">
    <button id="calendar-theme" class="calendar-theme-button" type="button" aria-label="Переключить тему календаря">☀</button>
    <div class="custom-calendar">
      <div class="custom-calendar-top"><span class="custom-calendar-title">Мой календарь</span><button id="add-event" class="add-event-button" type="button">+ Событие</button></div>
      <div id="calendar-days" class="calendar-days"></div>
    </div>
  </section>
  <dialog id="event-dialog" class="event-dialog">
    <form id="event-form" method="dialog">
      <h3>Новое событие</h3>
      <label for="event-title">Название</label><input id="event-title" required maxlength="80" autocomplete="off">
      <label for="event-date">Дата</label><input id="event-date" type="date" required>
      <label for="event-time">Время</label><input id="event-time" type="time" required>
      <div class="event-dialog-actions"><button id="cancel-event" class="add-event-button" type="button">Отмена</button><button class="add-event-button" type="submit">Сохранить</button></div>
    </form>
  </dialog>
  <script src="block.js"></script>
</body>
</html>
