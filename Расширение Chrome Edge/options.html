<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Режим концентрации — настройки</title>
  <link rel="stylesheet" href="vendor/materialize.min.css">
  <style>
    :root { color-scheme: dark; --bg:#090909; --panel:#1b1b1b; --line:#414141; --text:#f0f0f0; --muted:#aaa; --blue:#d6d6d6; --green:#e9e9e9; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font:15px/1.5 "Segoe UI", Arial, sans-serif; color:var(--text); background:radial-gradient(circle at 15% 0%, #303030 0, transparent 32%),var(--bg); }
    .shell { width:min(900px,calc(100% - 32px)); margin:0 auto; padding:46px 0 56px; }
    .logo { width:76px; height:76px; object-fit:cover; image-rendering:pixelated; border:2px solid #6b6b6b; border-radius:8px; box-shadow:0 12px 30px #0008; background:#111; }
    h1 { margin:0; font-size:32px; letter-spacing:-.5px; font-family:Consolas,"Courier New",monospace; }
    .subtitle { margin:5px 0 0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:1fr; gap:18px; }
    .card { padding:24px; border:1px solid var(--line); border-radius:8px; background:linear-gradient(145deg,#202020,#151515); box-shadow:0 18px 45px #0008; }
    .card h2 { margin:0 0 6px; font-size:19px; }
    .card p { margin:0 0 18px; color:var(--muted); }
    .focus-art { display:block; width:100%; height:190px; object-fit:cover; object-position:center 72%; margin:0 0 20px; border:1px solid #555; border-radius:6px; filter:grayscale(.15); }
    .control { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 0; }
    .control strong { display:block; font-size:16px; }
    .control small { color:var(--muted); }
    .state-actions { display:flex; align-items:center; gap:16px; }
    .timepicker-input { width:68px !important; height:28px !important; min-height:28px !important; margin:0 !important; padding:2px 4px !important; border:0 !important; border-bottom:1px solid #777 !important; border-radius:0 !important; color:var(--text) !important; background:transparent !important; font:600 13px Consolas,monospace !important; line-height:20px !important; text-align:center; cursor:pointer; }
    .focus-switch { position:relative; width:50px; height:27px; flex:0 0 auto; display:block; margin:0; padding:0; line-height:0; }
    .focus-switch input { position:absolute; opacity:0; width:0; height:0; }
    .focus-switch .slider { position:absolute; inset:0; display:block; border:1px solid #666; border-radius:999px; background:#383838; cursor:pointer; transition:background .2s,border-color .2s; }
    .focus-switch .slider-knob { position:absolute; display:block; width:20px; min-width:20px; max-width:20px; height:20px; min-height:20px; max-height:20px; left:3px; top:3px; border-radius:50%; background:#e8e8e8; box-shadow:0 1px 4px #0008; transition:transform .2s; }
    .focus-switch input:checked + .slider { border-color:#45c985; background:#45c985; }
    .focus-switch input:checked + .slider .slider-knob { transform:translateX(22px); }
    textarea { width:100%; min-height:260px; resize:vertical; padding:14px; border:1px solid var(--line); border-radius:12px; outline:0; color:var(--text); background:#101010; font:13px Consolas,monospace; }
    textarea:focus { border-color:#a8a8a8; box-shadow:0 0 0 3px #a8a8a822; }
    textarea::placeholder { color:#777; opacity:1; }
    .buttons { display:flex; gap:10px; margin-top:14px; }
    button { padding:11px 16px; border:1px solid #777; border-radius:5px; color:#111; background:var(--blue); font:600 14px "Segoe UI",Arial; cursor:pointer; }
    button:hover { filter:brightness(1.1); }
    button.secondary { color:var(--text); background:#292929; }
    #status { position:fixed; right:24px; top:24px; z-index:10; padding:12px 18px; border:1px solid #777; border-radius:5px; color:#f0f0f0; background:#242424; box-shadow:0 8px 24px #000b; opacity:0; transform:translateX(18px); pointer-events:none; transition:opacity .2s,transform .2s; }
    #status.show { opacity:1; transform:translateX(0); }
    .timepicker-display { background:#292929 !important; color:#fff !important; }
    .timepicker-display-hours, .timepicker-display-minutes, .timepicker-display-ampm { color:#fff !important; opacity:1 !important; }
    .timepicker-display-am-pm, .timepicker-close { color:#45c985 !important; }
    .timepicker-clock { background:#d6d6d6 !important; }
    .timepicker-tick { color:#111 !important; opacity:1 !important; text-shadow:none !important; }
    .timepicker-tick.active, .timepicker-tick:hover { background:#45c985 !important; color:#111 !important; }
    .timepicker-canvas line, .timepicker-canvas-bg { stroke:#45c985 !important; fill:#45c985 !important; }
    .tips { display:grid; gap:12px; margin-top:14px; }
    @media (max-width:700px) { .shell { padding-top:28px; } .grid { grid-template-columns:1fr; } h1 { font-size:26px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="grid">
      <div class="card"><img class="focus-art" src="main-art.png" alt=""><h2>Основные настройки</h2>
        <div class="control"><div><strong>Состояние</strong><small id="state">Загрузка…</small></div><div class="state-actions"><input id="timepicker" class="timepicker timepicker-input" type="text" value="00:30" placeholder="Время"><label class="focus-switch"><input id="enabled" type="checkbox"><span class="slider"><span class="slider-knob"></span></span></label></div></div>
        <input id="timerMinutes" type="hidden" value="30">
      </div>
      <div class="card"><h2>Заблокированные сайты</h2><textarea id="hosts" spellcheck="false" placeholder="youtube.com\nexample.com"></textarea><div class="buttons"><button id="save">Сохранить список</button><button id="reset" class="secondary">Вернуть список по умолчанию</button></div><div id="status" role="status"></div></div>
    </section>
  </main>
  <script src="vendor/materialize.min.js"></script>
  <script src="options.js"></script>
</body>
</html>
